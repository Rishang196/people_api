<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human API - Register</title>
</head>

<body>

    <h1>Create Human API Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>

    <script src="auth.js"></script>

</body>
</html>
